# Configuration Alembic du backend AgriMada (tâche P1.11).
# L'URL de la base vient de DATABASE_URL (app/core/config.py) : ne pas la renseigner ici.
#
#   alembic upgrade head        # appliquer les migrations
#   alembic revision --autogenerate -m "message"
#
# Base créée avant Alembic par Base.metadata.create_all : `alembic stamp 0001_schema_initial`
# puis `alembic upgrade head`.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
