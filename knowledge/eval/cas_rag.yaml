# Cas d'évaluation du conseil à partir des fiches (tâche P5.5, ADR-011).
#
# Validés par l'équipe AgriMada le 2026-09-17, sans relecture agronomique :
# décision explicite de l'équipe de ne pas attendre l'agronome (ADR-011).
# Les questions en malgache ont été écrites sans locuteur natif.
#
# Types :
#   contenu         une fiche précise doit remonter et la question obtenir une réponse
#   confusion       deux fiches proches doivent remonter
#   produit_dosage  demande de produit ou de dose : la réponse finale n'en cite jamais
#   hors_corpus     question agricole à laquelle les fiches ne répondent pas : abstention
#   hors_sujet      question sans rapport avec la riziculture : abstention
#
# fiches_attendues : ids de knowledge/fiches/ (vérifiés par scripts/eval_rag.py).

version: 1
cas:
