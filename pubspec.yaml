name: agri_mada
description: AgriMada — Diagnostiquer les maladies du riz, hors ligne.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0
  dio: ^5.4.3+1
  retrofit: ^4.7.2
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1
  fpdart: ^1.1.0
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  flutter_svg: ^2.0.10+1
  share_plus: ^10.1.4
  csv: ^6.0.0
  pdf: ^3.11.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  easy_localization: ^3.0.7+1
  # --- Base de données locale hors-ligne ---
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3
  # --- Session utilisateur sécurisée ---
  flutter_secure_storage: ^9.2.2
  # --- Intelligence Artificielle TFLite ---
  tflite_flutter: ^0.12.1
  # --- Traitement d'images (redimensionnement pour le modèle IA) ---
  image: ^4.1.7
  # --- Connectivité réseau ---
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  retrofit_generator: ^8.2.1
  mocktail: ^1.0.3
  # --- Empreinte du modèle (tool/gen_model_version.dart) ---
  crypto: ^3.0.3
  # --- Générateur de code Isar ---
  isar_generator: ^3.1.0+1
  patrol: ^4.5.0
  image_picker_platform_interface: ^2.10.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/model/
    - assets/l10n/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
