# Sources publiques récupérées par ml/scripts/fetch_public_data.py
#
# Licences : décision d'équipe du 2026-09-14, ce sont des projets publics. La
# licence déclarée par l'hébergeur est relevée quand elle existe ; en CC BY,
# citer la source (champ `attribution`) dans toute publication.
#
# Destination : ml/data/raw/<id>/ pour les jeux de données,
# knowledge/sources/<id>/ pour les documents. Ces dossiers ne sont pas versionnés.

datasets:
  - id: sethy_5932
    type: mendeley
    mendeley_id: fwcj7stb8r
    version: 2
    licence: CC BY 4.0
    attribution: "Sethy P.K., Barpanda N.K., Rath A.K., Behera S.K. (2020). Deep feature based rice leaf disease identification using support vector machine. Computers and Electronics in Agriculture 175, 105527."

  - id: riceseg_5932
    type: mendeley
    mendeley_id: 92jc6w6mcy
    version: 1
    licence: CC BY 4.0
    attribution: "RiceSeg-5932, Mendeley Data, doi:10.17632/92jc6w6mcy.1"

  - id: mendeley_hx6f852hw4
    type: mendeley
    mendeley_id: hx6f852hw4
    version: 2
    # Images déjà augmentées exclues (règle 3 de ml/DATASETS.md).
    exclude_folders: [Augmented]
    licence: CC BY 4.0
    attribution: "Rice Leaf Bacterial and Fungal Disease Dataset, Mendeley Data, doi:10.17632/hx6f852hw4.2"

  - id: dhan_shomadhan
    type: mendeley
    mendeley_id: znsxdctwtt
    version: 1
    licence: CC BY 4.0
    attribution: "Dhan-Shomadhan, Mendeley Data, doi:10.17632/znsxdctwtt.1"

  - id: riceleafbd
    type: mendeley
    mendeley_id: kx9rx8p2mz
    version: 1
    licence: CC BY 4.0
    attribution: "RiceLeafBD, Mendeley Data, doi:10.17632/kx9rx8p2mz.1"

  - id: hf_rice_disease
    type: huggingface
    repo_id: Subh775/Rice-Disease-Classification-Dataset
    files: [rename.zip, README.md]
    licence: Apache-2.0

  - id: paddy_doctor
    type: kaggle
    competition: paddy-disease-classification
    licence: CC BY
    note: "Sous-ensemble de 10 407 images étiquetées (10 classes) et 3 469 images de test sans étiquette. Récupéré à la main le 2026-09-15 : ml/data/raw/paddy_doctor/paddy-disease-classification.zip. Avec un jeton, accepter le règlement de la compétition sur kaggle.com avant le téléchargement."

  - id: nutrient_deficiency_rice
    type: kaggle
    dataset: guy007/nutrientdeficiencysymptomsinrice
    licence: non précisée par l'hébergeur
    note: "Récupéré à la main le 2026-09-15 : ml/data/raw/nutrient_deficiency_rice/nutrientdeficiencysymptomsinrice.zip (fichier Kaggle archive.zip renommé)."

  - id: ip102
    type: manual
    url: https://drive.google.com/drive/folders/1svFSy2Da3cVMvekBwe13mzyx38XZ9xWo
    licence: libre pour usage académique
    note: "Archive volumineuse (102 classes, dont 14 du riz). Reportée au module insecte."

# Jeux écartés et raison, pour ne pas les rechercher à nouveau.
excluded:
  banglariceleaf: aucun lien de téléchargement public trouvé
  rice_grain_disease: données non publiées, à demander aux auteurs
  frontiers_33026: données non publiées
  vbookshelf_120: jeu du modèle actuel, non représentatif (feuilles sur fond blanc)
  riceyleafdisease_t46kkgh2yw: doublon de mendeley_hx6f852hw4 (même description)
  rice_panicle_drone_ndb6t28xbk: détection de panicules par drone, sans maladies

